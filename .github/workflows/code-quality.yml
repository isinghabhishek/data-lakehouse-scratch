name: Code Quality Analysis

on:
  push:
    branches: [master, main, setup/**]
  pull_request:
    branches: [master, main]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 bandit safety black isort

      - name: Security scan with bandit
        run: |
          bandit -r scripts/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Dependency vulnerability check
        run: |
          if [ -f scripts/requirements.txt ]; then
            safety check --json || true
          fi
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README exists
        run: |
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi
          echo "✓ README.md found"

      - name: Verify LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "ERROR: LICENSE file not found"
            exit 1
          fi
          echo "✓ LICENSE found"

      - name: Check markdown formatting
        run: |
          grep -q '^# ' README.md || echo "WARNING: No main heading found in README.md"
          echo "✓ Markdown structure looks reasonable"

  file-structure-check:
    name: Project Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate directory structure
        run: |
          echo "Checking project structure..."
          
          required_dirs=(
            "dbt"
            "scripts"
            "tests"
            "data"
            "trino"
          )
          
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required directory $dir not found"
              exit 1
            fi
            echo "✓ $dir directory exists"
          done

      - name: Validate key files
        run: |
          required_files=(
            "docker-compose.yml"
            "Makefile"
            ".env.example"
            "README.md"
            "LICENSE"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file $file not found"
              exit 1
            fi
            echo "✓ $file exists"
          done

      - name: List project structure
        run: |
          echo "Project structure:"
          find . -maxdepth 2 -type f -o -type d | grep -v '.git' | sort
