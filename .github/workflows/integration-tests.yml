name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run integration tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  integration-test-setup:
    name: Validate Integration Test Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check required test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 requests
          echo "✓ Integration test dependencies installed"

  demo-scripts-validation:
    name: Validate Demo Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify demo scripts exist
        run: |
          demo_scripts=(
            "scripts/demo_acid.sh"
            "scripts/demo_time_travel.sh"
            "scripts/demo_schema_evolution.sh"
            "scripts/demo_branching.sh"
          )
          for script in "${demo_scripts[@]}"; do
            if [ ! -f "$script" ]; then
              echo "ERROR: Demo script $script not found"
              exit 1
            fi
          done
          echo "✓ All demo scripts exist"

      - name: Validate demo script syntax
        run: |
          find scripts -name 'demo_*.sh' -type f | while read script; do
            echo "Validating $script"
            bash -n "$script" || exit 1
          done
          echo "✓ All demo scripts have valid syntax"

  data-pipeline-validation:
    name: Validate Data Pipeline Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check pipeline scripts exist
        run: |
          required_scripts=(
            "scripts/ingest_bronze.py"
            "scripts/download_sample_data.sh"
            "scripts/benchmark.sh"
          )
          for script in "${required_scripts[@]}"; do
            if [ ! -f "$script" ]; then
              echo "ERROR: Required script $script not found"
              exit 1
            fi
          done
          echo "✓ All required pipeline scripts exist"

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/ingest_bronze.py
          echo "✓ Python scripts compile successfully"
