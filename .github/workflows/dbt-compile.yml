name: dbt Compile & Validate

on:
  push:
    branches: [master, main, setup/**]
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-compile.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'dbt/**'

jobs:
  dbt-compile:
    name: dbt Compile & Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: dbt deps
        run: |
          cd dbt && dbt deps
        continue-on-error: true

      - name: dbt parse (validation)
        run: |
          cd dbt && dbt parse
        continue-on-error: true

      - name: dbt compile
        run: |
          cd dbt && dbt compile --select
