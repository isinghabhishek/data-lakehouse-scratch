jobs:
  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dbt/requirements.txt

      - name: dbt deps
        run: |
          cd dbt && dbt deps
        continue-on-error: true

      - name: dbt parse (validation)
        run: |
          cd dbt && dbt parse
        continue-on-error: true

      - name: Create dbt profile from Secrets
        env:
          TRINO_HOST: ${{ secrets.TRINO_HOST }}
          TRINO_PORT: ${{ secrets.TRINO_PORT }}
          TRINO_USER: ${{ secrets.TRINO_USER }}
          TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          TRINO_CATALOG: ${{ secrets.TRINO_CATALOG }}
          TRINO_SCHEMA: ${{ secrets.TRINO_SCHEMA }}
          TRINO_METHOD: ${{ secrets.TRINO_METHOD }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<YAML
          lakehouse:
            target: dev
            outputs:
              dev:
                type: trino
                method: "${TRINO_METHOD}"
                host: "${TRINO_HOST}"
                port: ${TRINO_PORT}
                user: "${TRINO_USER}"
                catalog: "${TRINO_CATALOG}"
                schema: "${TRINO_SCHEMA}"
                password: "${TRINO_PASSWORD}"
          YAML

      - name: dbt compile
        run: |
          cd dbt && dbt compile
