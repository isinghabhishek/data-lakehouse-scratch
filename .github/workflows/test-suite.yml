name: Test Suite

on:
  push:
    branches: [master, main, setup/**]
  pull_request:
    branches: [master, main]

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
          if [ -f dbt/requirements.txt ]; then pip install -r dbt/requirements.txt; fi
          pip install pytest pytest-cov pytest-timeout hypothesis

      - name: Run pytest
        run: |
          pytest tests/ --tb=short -v --cov=scripts --cov-report=xml
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        if: always()

  test-scripts-syntax:
    name: Test Scripts Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bash syntax
        run: |
          find scripts -name '*.sh' -type f | while read script; do
            echo "Checking syntax of $script"
            bash -n "$script" || exit 1
          done

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/*.py

  makefile-validation:
    name: Makefile Targets Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Makefile syntax
        run: |
          make -n help > /dev/null || exit 1
          echo "Makefile syntax is valid"

      - name: List available make targets
        run: make help
