name: 'lakehouse'
version: '1.0.0'
config-version: 2

profile: 'lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  lakehouse:
    silver:
      +materialized: table
      +file_format: iceberg
      +on_schema_change: append_new_columns
    gold:
      +materialized: table
      +file_format: iceberg
      +on_schema_change: append_new_columns
