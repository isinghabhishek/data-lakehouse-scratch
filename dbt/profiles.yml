lakehouse:
  target: dev
  outputs:
    dev:
      type: trino
      method: none           # "none" for unauthenticated Trino; change to "ldap" or "certificate" as needed
      host: ${TRINO_HOST}
      port: ${TRINO_PORT:-8080}
      user: ${TRINO_USER}
      catalog: ${TRINO_CATALOG}
      schema: ${TRINO_SCHEMA}
      password: ${TRINO_PASSWORD}  # optional depending on the method
